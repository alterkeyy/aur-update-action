name: Update AUR package

on:
  schedule:
    # GitHub Actions uses UTC; 17:00 UTC is 01:00 Asia/Shanghai.
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: aur-package-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel curl git jq openssh pacman-contrib

      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Update package metadata
        id: update
        shell: bash
        env:
          MANIFEST_URL: https://static.qoder.com.cn/qoder-cli-cn/channels/manifest.json
          PACKAGE_DIR: qoder-cli-cn
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/$PACKAGE_DIR"

          manifest=$(curl --fail --silent --show-error "$MANIFEST_URL")
          version=$(jq -er '.latest | strings' <<<"$manifest")
          current_version=$(sed -nE 's/^pkgver=([^[:space:]]+)$/\1/p' PKGBUILD)

          if [[ -z "$current_version" ]]; then
            echo 'Unable to read pkgver from PKGBUILD' >&2
            exit 1
          fi

          if [[ "$version" == "$current_version" ]]; then
            echo "No update: already at $current_version"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid version from manifest: $version" >&2
            exit 1
          fi

          sed -i -E "s/^pkgver=.*/pkgver=$version/" PKGBUILD

          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- updpkgsums
          runuser -u builder -- bash -c 'makepkg --printsrcinfo > .SRCINFO'

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit package update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qoder-cli-cn/PKGBUILD qoder-cli-cn/.SRCINFO
          git commit -m "update to $VERSION"
          git push origin HEAD:main

      - name: Configure AUR SSH
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'AUR_SSH_PRIVATE_KEY is not configured' >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_update_key
          chmod 600 ~/.ssh/aur_update_key
          ssh-keyscan -H aur.archlinux.org > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push update to AUR
        shell: bash
        run: |
          set -euo pipefail
          aur_dir=$(mktemp -d)
          trap 'rm -rf "$aur_dir"' EXIT
          aur_repo="$aur_dir/repository"
          aur_url=ssh://aur@aur.archlinux.org/qoder-cli-cn-bin.git
          ssh_command="ssh -i $HOME/.ssh/aur_update_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          GIT_SSH_COMMAND="$ssh_command" git clone "$aur_url" "$aur_repo"
          git -C "$aur_repo" rev-parse --git-dir
          cp -a "$GITHUB_WORKSPACE/qoder-cli-cn/." "$aur_repo/"

          git -C "$aur_repo" config user.name 'github-actions[bot]'
          git -C "$aur_repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$aur_repo" add -A

          if git -C "$aur_repo" diff --cached --quiet; then
            echo 'AUR package is already up to date'
            exit 0
          fi

          version='${{ steps.update.outputs.version }}'
          git -C "$aur_repo" commit -m "update to $version"
          GIT_SSH_COMMAND="$ssh_command" git -C "$aur_repo" push origin HEAD:master
